              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Im geltenden deutschen Sozialversicherungsrecht (SGB V) gilt das Alles-oder-Nichts-Prinzip: Ein Arbeitnehmer ist für die arbeitsvertraglich geschuldete Tätigkeit entweder voll arbeitsfähig oder voll arbeitsunfähig. Die einzige gesetzlich verankerte Form schrittweiser Rückkehr ist die stufenweise Wiedereingliederung nach § 74 SGB V (Hamburger Modell). Eine reguläre Ad-hoc-Teilkrankschreibung (z. B. 50 % AU) ist Gegenstand bundesweiter Reformdebatten."

              "@type": "Question",
              "name": "Wie unterscheidet sich das Hamburger Modell von einer Teilkrankschreibung?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Beim Hamburger Modell (§ 74 SGB V) gilt der Arbeitnehmer rechtlich weiterhin als zu 100 % arbeitsunfähig. Er erhält kein reguläres Arbeitsentgelt, sondern Krankengeld oder Übergangsgeld. Eine echte Teilkrankschreibung würde hingegen Teilarbeit mit anteiligem Arbeitgeber-Lohn und ergänzendem Krankengeld rechtlich legitimieren."
              }
            },

              "@type": "Question",

              "acceptedAnswer": {
                "@type": "Answer",
                "text": "In den diskutierten Modellen zahlt der Arbeitgeber den regulären Lohn für die tatsächlich geleisteten Arbeitsstunden. Für die krankheitsbedingt ausgefallenen Stunden greift entweder die anteilige Entgeltfortzahlung (§ 3 EntgFG in den ersten 6 Wochen) oder im Anschluss anteiliges Krankengeld durch die gesetzliche Krankenkasse (§ 44 SGB V)."
              }
