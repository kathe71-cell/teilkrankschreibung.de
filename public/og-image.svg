<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#0f172a"/>
  <defs>
    <radialGradient id="grad" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Badge -->
  <rect x="100" y="90" width="320" height="42" rx="21" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="124" cy="111" r="6" fill="#10b981"/>
  <text x="142" y="117" font-family="-apple-system, system-ui, sans-serif" font-size="15" font-weight="700" fill="#e2e8f0" letter-spacing="1">DEUTSCHES FACHPORTAL 2026</text>

  <!-- Title -->
  <text x="100" y="220" font-family="-apple-system, system-ui, sans-serif" font-size="68" font-weight="900" fill="#ffffff" letter-spacing="-2">Teilkrankschreibung</text>
  <text x="100" y="290" font-family="-apple-system, system-ui, sans-serif" font-size="44" font-weight="700" fill="#10b981">Rechtslage, Rechner &amp; Arbeitsrecht</text>

  <!-- Subtitle -->
  <text x="100" y="370" font-family="-apple-system, system-ui, sans-serif" font-size="24" font-weight="400" fill="#94a3b8">
    <tspan x="100" dy="0">Das Informationsportal zu Teilarbeitsunfähigkeit, Stufenweiser Wiedereingliederung</tspan>
    <tspan x="100" dy="36">(Hamburger Modell § 74 SGB V), Entgeltfortzahlung &amp; Krankengeldanspruch.</tspan>
  </text>

  <!-- Stats Grid -->
  <g transform="translate(100, 470)">
    <rect x="0" y="0" width="220" height="80" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="24" y="34" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" letter-spacing="1">RECHTSNORM</text>
    <text x="24" y="64" font-family="-apple-system, system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffffff">§ 74 SGB V / AU-RL</text>

    <rect x="250" y="0" width="220" height="80" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="274" y="34" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" letter-spacing="1">SIMULATION</text>
    <text x="274" y="64" font-family="-apple-system, system-ui, sans-serif" font-size="22" font-weight="800" fill="#10b981">Live-Entgeltrechner</text>

    <rect x="500" y="0" width="220" height="80" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="524" y="34" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" letter-spacing="1">STATUS</text>
    <text x="524" y="64" font-family="-apple-system, system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffffff">Aktuell Sept. 2026</text>
  </g>

  <!-- Domain Tag -->
  <text x="1100" y="570" text-anchor="end" font-family="-apple-system, system-ui, sans-serif" font-size="20" font-weight="700" fill="#64748b">teilkrankschreibung.de</text>
</svg>
